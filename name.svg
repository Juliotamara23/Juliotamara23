<svg viewBox="0 0 800 130" width="800" height="130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Julio Támara">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#2de2e6"/>
      <stop offset="100%" stop-color="#00b3ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      @media (prefers-color-scheme: light) {
        .grid { stroke: #0891b2; }
        .name { fill: #0e7490; }
        .tag { fill: #334155; }
      }
      @media (prefers-color-scheme: dark) {
        .grid { stroke: #00e5ff; }
        .name { fill: url(#neon); }
        .tag { fill: #7dd3fc; }
      }
    </style>
  </defs>

  <!-- digital grid -->
  <g class="grid" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 32 H800 M0 64 H800 M0 96 H800"/>
    <path d="M114 0 V130 M228 0 V130 M342 0 V130 M456 0 V130 M570 0 V130 M684 0 V130"/>
  </g>

  <!-- name -->
  <text class="name" filter="url(#glow)" x="400" y="72" text-anchor="middle" font-size="54" font-weight="800" letter-spacing="6">JULIO TÁMARA</text>

  <!-- tagline -->
  <text class="tag" x="400" y="105" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="8">SOFTWARE ENGINEER &middot; PYTHON & NODE.JS & IA & AUTOMATION</text>
</svg>